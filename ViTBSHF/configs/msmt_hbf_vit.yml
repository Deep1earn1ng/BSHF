# configs/msmt_hbf_vit.yml
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/public/home/deepwrh/ViTBSHF/data/vit_base_ics_cfs_lup.pth'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CIRCLE: 'yes'
  NAME: 'vit_msmt_ics'
  DEVICE: 'cuda'
  STRIDE_SIZE: [16, 16]
  SIE_CAMERA: True
  SIE_VIEW: False
  
  # HBF 创新架构配置
  IF_WITH_HBF: 'yes'
  KEEP_RATIO: 1.0                
  TRIPLET_MARGIN: 0.3
  # MSMT 数据集庞大且有噪声，适当调整中心约束权重
  CIRCLE_WEIGHT: 0.005           

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATASETS:
  NAMES: 'msmt17'
  # 指向您指定的路径
  ROOT_DIR: '/dev/shm/deepwrh_mtmc17'   

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 8               
  NUM_WORKERS: 8                

SOLVER:
  OPTIMIZER_NAME: 'SGD'         
  MOMENTUM: 0.9                 
  BASE_LR: 0.008                
  WARMUP_EPOCHS: 10             
  # MSMT 数据量庞大，收敛需要更多 Epoch，但在有预训练权重的情况下 200 仍是主流
  MAX_EPOCHS: 200               
  SCHEDULER_NAME: 'cosine'      
  WEIGHT_DECAY: 0.0001          
  
  # 您的 64G 显存环境完全可以支撑 64 的 Batch Size
  IMS_PER_BATCH: 64          
  LOG_PERIOD: 50
  EVAL_PERIOD: 10

TEST:
  EVAL: True                    
  IMS_PER_BATCH: 64            
  RE_RANKING: True              
  RE_RANKING_K1: 20             
  RE_RANKING_K2: 6              
  FEAT_NORM: 'yes'              
  WEIGHT: ''                    
  NECK_FEAT: 'before'           
  AQE: []                       

OUTPUT_DIR: './logs/msmt'